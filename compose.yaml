name: tuuvo-site

services:
  web:
    image: tuuvo-site:current
    build:
      context: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3300:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - tuuvo_site_internal
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tuuvo_site_internal:
    name: tuuvo_site_internal
    driver: bridge
